
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Tango Arranger
        env:
          VITE_APP_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Run full regression suite including shared musical editing
        run: npm run test:regression

      - name: Test expressive tempo, fermata and native MuseScore ties
        run: node tests/tempo-expression-export.cjs

      - name: Test leadsheet import and vocal phrase alignment
        run: node tests/new-song-leadsheet.cjs && node tests/microphone-pitch.cjs && node tests/microphone-tuner.cjs && node tests/microphone-recording.cjs && node tests/pitch-postprocess.cjs && node tests/instrument-badge.cjs

      - name: Test keyboard and string capture timing
        run: npm run test:instrument-capture

      - name: Test rhythm preview, custom rhythms and editor gestures
        run: node tests/rhythm-workflow.cjs && node tests/rhythm-editor.cjs && node tests/live-capture-layout.cjs && node tests/topbar-map-layout.cjs && node tests/tap-capture.cjs

      - name: Test virtualized note grid and follow-scrolling
        run: node tests/note-grid-virtualization.cjs

      - name: Test phone header and section action layout
        run: node tests/phone-section-layout.cjs

      - name: Test collapsed section icon actions
        run: node tests/section-icon-layout.cjs

      - name: Test instrument Learn focus and settings
        run: node tests/instrument-learn-focus.cjs && node tests/learn-pitch-and-range.cjs && node tests/project-tuning.cjs

      - name: Test tango gesture expression and export
        run: npm run test:gestures

      - name: Test independent difficulty editions and printable export
        run: npm run test:editions

      - name: Test editable phrase planner and protected editions
        run: npm run test:phrases

      - name: Test rhythm snapping and contextual editor menus
        run: npm run test:rhythm-snap

      - name: Test contextual phrase, rhythm and dynamics interactions
        run: npm run test:contextual

      - name: Test MusicXML parsing, score alignment and protected merges
        run: npm run test:alignment

      - name: Test Home Screen update detection
        run: node tests/app-update.cjs

      - name: Verify production output
        run: |
          grep -Fq '<meta name="tango-build" content="${{ github.sha }}">' dist/index.html
          test -f dist/index.html
          test -d dist/assets
          if grep -q '/src/main.ts' dist/index.html; then
            echo "ERROR: Development entry point remains in production HTML"
            exit 1
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_ISLAND_0E8FF2210 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_ISLAND_0E8FF2210 }}
          action: "close"
